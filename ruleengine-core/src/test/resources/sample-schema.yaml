schema: transaction-v1

fields:
  purpose:
    type: text
    normalizers:
      - trim
      - lowercase
      - german_umlaut_fold
    operators:
      - equals
      - contains

  amount:
    type: decimal
    operators:
      - equals
      - gt
      - gte

  country:
    type: text
    operators:
      - equals
      - startsWith

  tags:
    type: string_set
    operators:
      - containsAny
      - containsAll

