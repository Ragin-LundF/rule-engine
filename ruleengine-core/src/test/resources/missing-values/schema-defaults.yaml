# schema.yaml with `missing: empty` on periods, events.unclassified and the object fees.
name: missing-values-defaults
fields:
  periods:
    type: string_set
    missing: empty
  events:
    type: object
    fields:
      confirmed:
        type: collection
        fields:
          period: { type: text }
          count: { type: integer }
      unclassified:
        type: collection
        missing: empty
        fields:
          period: { type: text }
          count: { type: integer }
  fees:
    type: object
    missing: empty
    fields:
      rows:
        type: collection
        fields:
          period: { type: text }
          amount: { type: decimal }
  income:
    type: object
    fields:
      rows:
        type: collection
        fields:
          period: { type: text }
          amount: { type: decimal }
