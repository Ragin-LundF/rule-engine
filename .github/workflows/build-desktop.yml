name: Build Desktop App

on:
  release:
    types: [published]

jobs:
  build:
    name: Build native package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: packageMsi
            artifact_name: windows-installer
            artifact_path: ruleengine-ui/build/compose/binaries/main/msi/*.msi

          - os: macos-latest
            task: packageDmg
            artifact_name: macos-installer
            artifact_path: ruleengine-ui/build/compose/binaries/main/dmg/*.dmg

          - os: ubuntu-latest
            task: packageDeb
            artifact_name: linux-installer
            artifact_path: ruleengine-ui/build/compose/binaries/main/deb/*.deb

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'liberica'

      - name: Make Gradle wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: Build package
        run: ./gradlew :ruleengine-ui:${{ matrix.task }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}

      - name: Upload release asset(s)
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.artifact_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
