kotlin.code.style=official
# The IDE ships its own Kotlin stdlib; bundling a second copy breaks class loading.
kotlin.stdlib.default.dependency=false
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# IDE the plugin is built and run against. 2026.3 is the first release found running on JBR 25.
platformVersion=2026.3
