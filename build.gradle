import dev.detekt.gradle.Detekt
import dev.detekt.gradle.DetektCreateBaselineTask
import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id "signing"
    id "maven-publish"
    alias(libs.plugins.version.catalog.update)
    alias(libs.plugins.kotlin.jvm) apply false
    alias(libs.plugins.kotlin.multiplatform) apply false
    alias(libs.plugins.jetbrains.compose) apply false
    alias(libs.plugins.jetbrains.compose.kotlin.plugin) apply false
    alias(libs.plugins.detekt) apply false
    alias(libs.plugins.jreleaser)
    alias(libs.plugins.kotlin.dokka) apply false
}

apply from: "${rootDir}/config/gradle/wrapper.gradle"
apply from: "${rootDir}/config/gradle/version_updates.gradle"

// JReleaser runs only in the root project: all modules are staged into the root
// build/staging-deploy and uploaded to Maven Central as one deployment (one release).
jreleaser {
    project {
        name = "rule-engine"
        description = "Rule engine for simple rule execution, re-usable schemas and actions"
        copyright = "Ragin-LundF"
        license = "MIT"
        links {
            homepage = "https://github.com/Ragin-LundF/rule-engine"
        }
        authors = ["Ragin-LundF"]
    }
    signing {
        active = 'ALWAYS'
        verify = false
        armored = true
        mode = 'FILE'
        publicKey = "${rootDir}/ragin_public.pgp"
        secretKey = "${rootDir}/ragin_secret.pgp"
    }
    deploy {
        maven {
            mavenCentral {
                sonatype {
                    active = 'ALWAYS'
                    url = 'https://central.sonatype.com/api/v1/publisher'
                    stagingRepository(layout.buildDirectory.dir('staging-deploy').get().asFile.path)
                }
            }
        }
    }
}

subprojects {
    // export of classes for subscripts
    ext.KotlinCompile = KotlinCompile
    ext.JvmTarget = JvmTarget
    ext.Detekt = Detekt
    ext.DetektCreateBaselineTask = DetektCreateBaselineTask

    apply plugin: "maven-publish"
    apply plugin: "org.jetbrains.dokka"
    apply from: "${rootDir}/config/gradle/publishing.gradle"

    apply from: "${rootDir}/config/gradle/java.gradle"
    apply from: "${rootDir}/config/gradle/dokka.gradle"
    apply from: "${rootDir}/config/gradle/testing.gradle"
    apply from: "${rootDir}/config/gradle/static_analysis.gradle"
}
