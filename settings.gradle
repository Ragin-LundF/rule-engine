pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        google()
        maven { url = uri('https://maven.pkg.jetbrains.space/public/p/compose/dev') }
    }
    plugins {
        // Declare plugin versions here so module build scripts can apply them without repeating versions
        id 'org.jetbrains.kotlin.multiplatform' version '2.4.0'
        id 'org.jetbrains.compose' version '1.11.1'
        id 'org.jetbrains.kotlin.plugin.compose' version '2.4.0'
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
        maven { url = uri('https://maven.pkg.jetbrains.space/public/p/compose/dev') }
    }
}

rootProject.name = 'rule-engine'

// Include new submodules
include ':ruleengine-core'
include ':ruleengine-ui'

