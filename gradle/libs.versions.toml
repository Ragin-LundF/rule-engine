[versions]
kotlin = "2.3.21"
# Jackson 3 series - prefer the latest compatible 3.x release. You can update this to a newer patch version if available.
jackson = "3.1.3"

[libraries]
# Kotlin test libraries
kotlinTest = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinTestJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }

# Jackson 3 libraries (use version.ref = "jackson")
jacksonModuleKotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
jacksonDataformatYaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
