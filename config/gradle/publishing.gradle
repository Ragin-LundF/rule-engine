afterEvaluate {
    tasks.matching { it.name.startsWith("publish") }.configureEach {
        dependsOn(tasks.named("dokkaGenerateHtmlJar"))
    }
    tasks.matching { it.name.contains("MetadataFileFor") || it.name.contains("PomFileFor") }.configureEach {
        dependsOn(tasks.named("dokkaGenerateHtmlJar"))
    }
}

def configurePublication = { publicationComponent ->
    publishing {
        publications {
            maven(MavenPublication) {
                from publicationComponent

                artifactId = project.ext.has("publishArtifactId") ? project.ext.publishArtifactId : project.name
                version = "${version}"
                // Add Dokka-generated Javadoc jar (lazy reference)
                artifact(project.provider { tasks.named("dokkaGenerateHtmlJar").get() })
                pom {
                    // Deferred: `pluginManager.withPlugin('java')` fires while the subproject's own
                    // build.gradle is still being evaluated, so `ext.publishName` is not set yet.
                    name.set(project.provider {
                        project.ext.has("publishName") ? project.ext.publishName : project.name
                    })
                    description.set(project.provider {
                        project.ext.has("publishDescription")
                                ? project.ext.publishDescription
                                : "Rule engine module: ${project.name}"
                    })
                    url = "https://github.com/Ragin-LundF/rule-engine"
                    scm {
                        connection = "scm:git:git@github.com:Ragin-LundF/rule-engine.git"
                        developerConnection = "scm:git:ssh://github.com/Ragin-LundF/rule-engine.git"
                        url = "https://github.com/Ragin-LundF/rule-engine"
                    }
                    licenses {
                        license {
                            name = "MIT"
                            url = "https://github.com/Ragin-LundF/rule-engine/blob/main/LICENSE"
                        }
                    }
                    developers {
                        developer {
                            id = "Ragin-LundF"
                            name = "Ragin-LundF"
                            organizationUrl = "https://github.com/Ragin-LundF/rule-engine"
                        }
                    }
                }
            }
        }

        repositories {
            maven {
                url = layout.buildDirectory.dir('staging-deploy')
            }
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/Ragin-LundF/rule-engine")
                credentials {
                    username = System.getenv("GITHUB_ACTOR")
                    password = System.getenv("GITHUB_TOKEN")
                }
            }
        }
    }
}

// ruleengine-ui module: configure the auto-generated jvm publication and disable kotlinMultiplatform publish tasks
if (project.name == "ruleengine-ui") {
    afterEvaluate {
        tasks.withType(AbstractPublishToMaven).configureEach {
            if (publication?.name == "kotlinMultiplatform") {
                enabled = false
            }
        }
        publishing.publications.withType(MavenPublication).configureEach {
            if (name == "jvm") {
                artifactId = "ruleengine-ui"
                version = "${project.version}"
                artifact(project.provider { tasks.named("dokkaGenerateHtmlJar").get() })
                pom {
                    name = project.ext.has("publishName") ? project.ext.publishName : "ruleengine-ui"
                    description = project.ext.has("publishDescription") ? project.ext.publishDescription : "Desktop UI for the rule engine"
                    url = "https://github.com/Ragin-LundF/rule-engine"
                    scm {
                        connection = "scm:git:git@github.com:Ragin-LundF/rule-engine.git"
                        developerConnection = "scm:git:ssh://github.com/Ragin-LundF/rule-engine.git"
                        url = "https://github.com/Ragin-LundF/rule-engine"
                    }
                    licenses {
                        license {
                            name = "MIT"
                            url = "https://github.com/Ragin-LundF/rule-engine/blob/main/LICENSE"
                        }
                    }
                    developers {
                        developer {
                            id = "Ragin-LundF"
                            name = "Ragin-LundF"
                            organizationUrl = "https://github.com/Ragin-LundF/rule-engine"
                        }
                    }
                }
            }
        }
    }
    publishing {
        repositories {
            maven {
                url = layout.buildDirectory.dir('staging-deploy')
            }
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/Ragin-LundF/rule-engine")
                credentials {
                    username = System.getenv("GITHUB_ACTOR")
                    password = System.getenv("GITHUB_TOKEN")
                }
            }
        }
    }
}


// BOM/Platform module
pluginManager.withPlugin('java-platform') {
    configurePublication(components.javaPlatform)
}

// java-library modules
pluginManager.withPlugin('java') {
    configurePublication(components.java)
}

jreleaser {
    signing {
        active = 'ALWAYS'
        verify = false
        armored = true
        mode = 'FILE'
        publicKey = "${rootDir}/ragin_public.pgp"
        secretKey = "${rootDir}/ragin_secret.pgp"
    }
    deploy {
        maven {
            mavenCentral {
                sonatype {
                    active = 'ALWAYS'
                    url = 'https://central.sonatype.com/api/v1/publisher'
                    stagingRepository('build/staging-deploy')
                }
            }
        }
    }
}
